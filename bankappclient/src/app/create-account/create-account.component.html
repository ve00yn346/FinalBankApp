<section class="panel form-panel">
  <h3 class="page-title">Create New Account</h3>

  <form #createAccountForm="ngForm" (ngSubmit)="onSubmit(createAccountForm)" class="d-grid gap-3" novalidate>
    <div>
      <label class="form-label">Name</label>
      <input type="text" class="form-control" [(ngModel)]="account.name" name="name" #name="ngModel" required minlength="3">
      <div class="text-danger small mt-1" *ngIf="name.invalid && (name.touched || createAccountForm.submitted)">
        Name is required and must be at least 3 characters.
      </div>
    </div>

    <div>
      <label class="form-label">Initial Balance</label>
      <input type="number" class="form-control" [(ngModel)]="account.balance" name="balance" #balance="ngModel" required min="0">
      <div class="text-danger small mt-1" *ngIf="balance.invalid && (balance.touched || createAccountForm.submitted)">
        Initial balance is required and cannot be negative.
      </div>
    </div>

    <div>
      <label class="form-label">Email</label>
      <input type="email" class="form-control" [(ngModel)]="account.email" name="email" #email="ngModel" required email>
      <div class="text-danger small mt-1" *ngIf="email.invalid && (email.touched || createAccountForm.submitted)">
        Enter a valid email address.
      </div>
    </div>

    <div>
      <label class="form-label">Phone</label>
      <input type="text" class="form-control" [(ngModel)]="account.phone" name="phone" #phone="ngModel" required pattern="^[0-9]{10,15}$">
      <div class="text-danger small mt-1" *ngIf="phone.invalid && (phone.touched || createAccountForm.submitted)">
        Phone must contain 10 to 15 digits.
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="createAccountForm.invalid">Create Account</button>
  </form>
</section>
