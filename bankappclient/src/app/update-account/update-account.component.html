<section class="panel form-panel">
  <h3 class="page-title">Update Account Contact</h3>

  <p class="info-note">Name and balance are read-only for safety. Only contact information can be edited.</p>

  <form #updateAccountForm="ngForm" (ngSubmit)="onSubmit(updateAccountForm)" class="d-grid gap-3" novalidate>
    <div>
      <label class="form-label">Name</label>
      <input type="text" class="form-control" [(ngModel)]="account.name" name="name" readonly>
    </div>

    <div>
      <label class="form-label">Balance</label>
      <input type="number" class="form-control" [(ngModel)]="account.balance" name="balance" readonly>
    </div>

    <div>
      <label class="form-label">Email</label>
      <input type="email" class="form-control" [(ngModel)]="account.email" name="email" #email="ngModel" required email>
      <div class="text-danger small mt-1" *ngIf="email.invalid && (email.touched || updateAccountForm.submitted)">
        Enter a valid email address.
      </div>
    </div>

    <div>
      <label class="form-label">Phone</label>
      <input type="text" class="form-control" [(ngModel)]="account.phone" name="phone" #phone="ngModel" required pattern="^[0-9]{10,15}$">
      <div class="text-danger small mt-1" *ngIf="phone.invalid && (phone.touched || updateAccountForm.submitted)">
        Phone must contain 10 to 15 digits.
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="updateAccountForm.invalid">Save Changes</button>
  </form>
</section>
